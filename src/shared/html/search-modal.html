<!-- Two boxes, because a name and an ID are two different questions — see
     src/shared/ui/riverSearch.js, which wires both forms on either page. -->
<div id="search-modal" class="backdrop hidden">
  <div class="card modal entry" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
    <div class="modal-head">
      <h3 id="search-modal-title" data-i18n="search.heading">Find a river</h3>
      <button class="btn sm" data-close="search-modal" data-i18n-aria-label="common.close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <form id="search-name-form" class="field" autocomplete="off">
        <label for="search-river-name" data-i18n="search.nameLabel">River name</label>
        <div class="row">
          <input id="search-river-name" type="text" role="combobox" aria-expanded="false"
                 aria-controls="search-results" aria-autocomplete="list"
                 data-i18n-placeholder="search.namePlaceholder" placeholder="e.g. Colorado"/>
          <button type="submit" class="btn primary" data-i18n="search.submit">Search</button>
          <button type="button" id="search-clear" class="btn" data-i18n="search.clear"
                  data-i18n-title="search.clearHint" title="Remove the highlighted river from the map">Clear</button>
        </div>
      </form>
      <div id="search-results" class="search-results hidden" role="listbox"
           data-i18n-aria-label="search.results" aria-label="Matching rivers"></div>
      <div id="search-name-status" class="hint status" role="status" aria-live="polite"></div>

      <form id="search-id-form" class="field search-second" autocomplete="off">
        <label for="search-river-id" data-i18n="search.idLabel">River ID</label>
        <div class="row">
          <input id="search-river-id" type="text" inputmode="numeric"
                 data-i18n-placeholder="search.idPlaceholder" placeholder="e.g. 760021611"/>
          <button type="submit" class="btn primary" data-i18n="search.submit">Search</button>
        </div>
      </form>
      <div id="search-id-status" class="hint status" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
