<!-- The Display section is the only part that differs between pages, so it is the slot; the
     downloaded-data section below it is the same on both because both share one dataset registry.

     params · class (extra classes on the .modal), children (the Display controls) -->
<div id="settings-modal" class="backdrop hidden">
  <div class="card modal {{class}}" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-head">
      <h3 id="settings-modal-title" data-i18n="settings.label">Settings</h3>
      <button class="btn sm" data-close="settings-modal" data-i18n-aria-label="common.close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <h4 data-i18n="settings.display">Display</h4>
      {{children}}
      <h4 data-i18n="settings.data">Downloaded Data</h4>
      <p class="hint" data-i18n="settings.data.hint">
        This site keeps local copies of some datasets for better performance. These can be redownloaded at any time and are safe to delete.
      </p>
      <!-- rows built by createDataSettings() in src/shared/ui/dataSettings.js, from the registry in
           src/shared/data/datasets.js -->
      <div id="data-list" class="col"></div>
      <div class="col data-foot">
        <div id="data-foot-status" class="hint status"></div>
        <div class="row wrap">
          <button id="btn-download-all" class="btn" data-i18n="settings.data.downloadAll">Download everything</button>
          <button id="btn-delete-all" class="btn" data-i18n="settings.data.deleteAll">Delete everything</button>
        </div>
      </div>
      <!-- stamped at build time by stampBuildDate() in vite.config.js; filled in initSettings() -->
      <p class="hint build-stamp"><span data-i18n="settings.build">Build</span> <span id="build-date"></span></p>
    </div>
  </div>
</div>
