<!-- The stack of controls floating over the map. Every page has the basemap picker; a page with
     more of them passes them in, and they sit above it.

     params · children (extra .anchor blocks, drawn above the basemap picker) -->
<div id="map-controls" class="col map-overlay">
  {{children}}
  <div class="anchor">
    <button id="basemap-btn" class="btn map" aria-haspopup="true" aria-expanded="false"
            data-i18n-title="basemap.about" data-i18n-aria-label="basemap.label"
            title="Basemap" aria-label="Basemap"></button>
    <div id="basemap-menu" class="card menu hidden" role="menu"></div>
  </div>
</div>
